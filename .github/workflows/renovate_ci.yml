name: Renovate CI
on: { pull_request: { } }
jobs:
  format-renovate-change:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: infrabits/ci-format-renovate-change@2ae271712c60951f2d660e15d24fc038233c8378 # v1.1.0
        with:
          github-token: ${{ github.token }}
