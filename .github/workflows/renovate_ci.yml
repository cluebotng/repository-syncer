name: Renovate CI
on: { pull_request: { } }
jobs:
  format-renovate-change:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: infrabits/ci-format-renovate-change@46f0762862b1265cf615b75440617f3f95cd13c0 # v1.3.0
        with:
          github-token: ${{ github.token }}
