name: Renovate CI
on: { pull_request: { } }
jobs:
  format-renovate-change:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: infrabits/ci-format-renovate-change@dc3bbd78d006bc45455c9723faa2c460fbfab7fc # v1.4.0
        with:
          github-token: ${{ github.token }}
