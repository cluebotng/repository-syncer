name: Renovate CI
on: { pull_request: { } }
jobs:
  format-renovate-change:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: infrabits/ci-format-renovate-change@bd82932dea71839f106778723f3f3c00a65877ee # v1.1.1
        with:
          github-token: ${{ github.token }}
